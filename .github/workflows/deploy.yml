name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild through the US trading day so the portfolio plan's prices stay
  # current: hourly 9:20am-4:20pm New York (EDT), then once after the close.
  # Cron is UTC; in winter (EST) these land an hour earlier in New York.
  schedule:
    - cron: '20 13-20 * * 1-5'
    - cron: '35 21 * * 1-5'

# GITHUB_TOKEN needs these to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages must be switched on once by hand first: Settings → Pages →
      # Source: GitHub Actions. The workflow's token is not allowed to.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Prices and a year of daily closes for data/tickers.json, into
      # public/market-data.json. Never fails the build.
      - name: Fetch market data
        run: node scripts/fetch-market-data.mjs

      # base_path is "/<repo>" for a project site, "" for a user site.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Without this, Pages' Jekyll step drops the _next directory.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
